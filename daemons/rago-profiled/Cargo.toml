[package]
name = "rago-profiled"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "GPL-2.0-only"
description = "Rago OS : applique au lancement d'un jeu son profil perf + sécurité (module M14)"
publish = false

[[bin]]
name = "rago-profiled"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
# Briques du canal M0 (identité du client d'un socket, groupe « rago »), sans les modifier.
rago-common = { path = "../../kernel/scx/rago-common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[dev-dependencies]
tempfile = "3"
