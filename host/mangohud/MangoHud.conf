# Rago OS — HUD MangoHud par défaut (module M2). Marqueur : rago-proton-layer
#
# Installé dans /etc/MangoHud.conf par host/setup_proton_layer.sh. MangoHud ne
# lit qu'UN fichier : celui du joueur s'il existe (~/.config/MangoHud/<jeu>.conf
# ou ~/.config/MangoHud/MangoHud.conf), sinon celui-ci.
# Session gamescope Rago : le HUD est dessiné par mangoapp et réglé par le
# menu rapide de Steam (overlay de performances), pas par ce fichier.
#
# Touches : Shift droit + F12 = afficher / cacher ; Shift gauche + F2 = journal.
# Journal pour le critère « 1 % low » (M1 : host/tests/m1_frametime_compare.sh) :
#   MANGOHUD_CONFIG=output_folder=$HOME/mangologs,log_duration=60,autostart_log=5 rago-launch %command%

legacy_layout=0
hud_compact
position=top-left
font_size=20
background_alpha=0.4
round_corners=6

# Images par seconde, 1 % low et 0,1 % low, temps d'image.
fps
fps_metrics=avg,0.01,0.001
frametime
frame_timing

cpu_stats
cpu_temp
gpu_stats
gpu_temp
ram
vram
# gamemode actif (M2) et limite de FPS éventuelle.
gamemode
show_fps_limit

toggle_hud=Shift_R+F12
toggle_logging=Shift_L+F2
log_duration=60
