#
# Rago OS — swap compressé en RAM (zram) de l'hôte (module M1).
# Marqueur : rago-host-tuning. Installé dans
# /etc/systemd/zram-generator.conf.d/rago.conf par host/setup_host_tuning.sh
# (paquet zram-generator requis).
#
# Le swap zram passe AVANT tout swap disque (priorité 100). Il ne sert jamais
# à l'hibernation (systemd l'exclut) : l'hibernation du Fast OS Switch (M8)
# utilise son propre swap sur le NVMe.

[zram0]
# Moitié de la RAM, au plus 8 Gio (taille non compressée).
zram-size = min(ram / 2, 8192)
compression-algorithm = zstd
swap-priority = 100
fs-type = swap
