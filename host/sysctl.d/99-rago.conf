#
# Rago OS — réglages noyau pour le jeu (module M1). Marqueur : rago-host-tuning
# Installé dans /etc/sysctl.d/ par host/setup_host_tuning.sh.
# Une ligne préfixée par « - » est ignorée si la clé n'existe pas sur ce noyau.

# --- Mémoire -----------------------------------------------------------------
# Nombre maximal de zones mémoire par processus. Certains jeux (DayZ, Hogwarts
# Legacy, Star Citizen...) en ouvrent bien plus que les 65530 historiques et
# plantent sinon. Même valeur que SteamOS.
vm.max_map_count = 2147483642

# Préférer garder les pages des programmes en RAM plutôt que de les envoyer
# dans le swap. Le swap zram (M1) reste un dernier recours.
vm.swappiness = 10

# Swap zram : lire une seule page à la fois (pas de lecture anticipée, inutile
# en RAM compressée et coûteuse en CPU).
vm.page-cluster = 0

# --- Réseau ------------------------------------------------------------------
# Tampons de socket plus grands : rafales UDP des jeux en ligne, téléchargements
# Steam rapides, sans perte de paquets quand un cœur est occupé.
net.core.rmem_default = 1048576
net.core.rmem_max = 16777216
net.core.wmem_default = 1048576
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 1048576 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
net.ipv4.udp_rmem_min = 8192
net.ipv4.udp_wmem_min = 8192

# File d'attente par défaut des interfaces : fq_codel, contre le « bufferbloat »
# (le ping reste bas même pendant un gros téléchargement).
net.core.default_qdisc = fq_codel

# --- Processeur --------------------------------------------------------------
# Split lock : quand un programme fait un accès mémoire « split lock », le noyau
# le ralentit volontairement (pause de ~10 ms) pour protéger les autres. Certains
# jeux Windows (via Proton) en font beaucoup et deviennent saccadés.
# 0 = pas de ralentissement. Contrepartie : un programme malveillant local peut
# dégrader les performances des autres cœurs (déni de service local, pas de
# fuite de données). C'est le choix de SteamOS et des distributions gaming.
# Clé présente seulement sur les CPU qui ont la détection (Intel récents).
-kernel.split_lock_mitigate = 0
