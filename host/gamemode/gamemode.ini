; Rago OS — configuration de gamemode (module M2). Marqueur : rago-proton-layer
;
; Installé dans /etc/gamemode.ini par host/setup_proton_layer.sh.
; Dans Rago, gamemode garde seulement ce qui ne se bat avec aucun module :
;   - priorité d'E/S du jeu (BE/0) ;
;   - écran de veille bloqué pendant le jeu ;
;   - signal « GameMode actif » (affiché par MangoHud, lu par certains jeux).
; Il NE touche PAS à ce que d'autres modules gèrent déjà :
;   - gouverneur CPU      -> rago-profiled (M14) par-dessus la base tuned (M1) ;
;                            la règle polkit /etc/polkit-1/rules.d/40-rago-gamemode.rules
;                            lui refuse cpugovctl (desiredgov ci-dessous est donc sans effet) ;
;   - épinglage / parking des cœurs (X3D, P/E-cores) -> scx_rago + rago-sched-hint (M0) ;
;   - renice / temps réel -> scx_rago (M0) ;
;   - split lock          -> sysctl de M1 (kernel.split_lock_mitigate=0) ;
;   - horloges GPU        -> M9 (hook gpu-clocks de rago-profiled).
; Un ~/.config/gamemode.ini du joueur peut remettre ces réglages :
; `host/setup_proton_layer.sh user` le signale.

[general]
reaper_freq=5
; Sans effet (polkit refuse cpugovctl) : gardé pour ne pas laisser gamemode
; choisir autre chose si la règle polkit était retirée.
desiredgov=performance
; -1 : pas de bascule de gouverneur selon la charge de l'iGPU.
igpu_power_threshold=-1
softrealtime=off
renice=0
ioprio=0
inhibit_screensaver=1
disable_splitlock=0

[filter]

[gpu]
; apply_gpu_optimisations laissé vide : gamemode n'applique rien au GPU (M9).
; (« 0 » ferait écrire une erreur à gamemoded à chaque jeu.)

[cpu]
park_cores=no
pin_cores=no

[supervisor]

[custom]
