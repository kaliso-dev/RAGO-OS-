# Rago OS — réglages de la bibliothèque partagée RAGO-LIB (module M7).
# Installé dans /etc/rago/rago-library.conf (root, 0644). Lu par
# /usr/lib/rago/rago-library.sh (commande rago-library).
#
# RAGO-LIB : partition NTFS de type « Microsoft basic data », nommée RAGO-LIB,
# créée par l'installateur (M12). Le micro-Windows y installe les jeux par les
# clients officiels ; Linux la monte avec le pilote noyau ntfs3, jamais en
# même temps que Windows, en écriture seulement si Windows est éteint.

# Périphérique (étiquette du système de fichiers NTFS).
RAGO_LIB_DEVICE=/dev/disk/by-label/RAGO-LIB

# Point de montage.
RAGO_LIB_DIR=/run/rago/lib

# Pilote : ntfs3 seulement (le noyau ; jamais ntfs-3g / FUSE). « ro » ou « rw »
# est ajouté par rago-library ; « force » est refusé.
RAGO_LIB_FSTYPE=ntfs3
# windows_names : refuse les noms que Windows ne sait pas lire (noyau ≥ 6.2).
# uid/gid/umask : tout appartient à root, lisible par tous (l'interface M11 lit).
RAGO_LIB_OPTIONS=uid=0,gid=0,umask=022,iocharset=utf8,windows_names,nosuid,nodev,noexec,noatime

# 1 : exiger du NTFS (pilote ntfs3, contrôle du volume avant toute écriture).
# 0 : réservé aux tests (autre système de fichiers sur une image).
RAGO_LIB_REQUIRE_NTFS=1
