# SPDX-License-Identifier: GPL-2.0
#
# Rago OS — profil tuned « rago-gaming » (module M1). Marqueur : rago-host-tuning
#
# Dérivé de latency-performance (fourni par tuned) : on en hérite tout, puis on
# ajoute / remplace ce qui suit. Installé par host/setup_host_tuning.sh, qui
# écrit aussi le fichier de variables (choix de la machine).
#
# Ce que latency-performance apporte déjà (hérité tel quel) :
#   [cpu]   governor=performance, energy_perf_bias=performance,
#           min_perf_pct=100 (intel_pstate), boost=1
#   [acpi]  platform_profile=performance (portables)
#   [vm]    dirty_bytes=10 %, dirty_background_bytes=3 %
#   [sysctl] vm.swappiness=10
#
# PAS d'isolation de cœurs (ni isolcpus, ni nohz_full, ni plugin scheduler) :
# un jeu natif utilise tous les cœurs, et scx_rago (M0) route déjà le jeu.

[main]
summary=Rago OS : jeu natif (derive de latency-performance)
include=latency-performance

[variables]
# Écrit par setup_host_tuning.sh (--cstates). Définit rago_force_latency.
include=/etc/tuned/rago-gaming-variables.conf

[cpu]
governor=performance
energy_perf_bias=performance
# amd-pstate / intel_pstate en mode actif : préférence énergie/perf du firmware.
energy_performance_preference=performance
# Gestion des C-states (optionnelle) :
#   deep    -> None : aucune limite (défaut ; garde le boost max des cœurs
#              actifs, indispensable sur portable et sur X3D)
#   shallow -> comme latency-performance : C1 au plus profond
#   poll    -> 0 : aucun C-state (latence minimale, très chaud, à éviter)
force_latency=${rago_force_latency}

[vm]
# THP en madvise : seules les applis qui le demandent ont des huge pages.
# Un profil de jeu (M14) peut passer à « always » le temps du jeu.
transparent_hugepages=madvise

[sysctl]
# Statistiques VM recalculées toutes les 60 s au lieu de 1 s : moins de
# réveils (« jitter ») sur tous les cœurs.
vm.stat_interval=60
# Détecteurs de blocage (soft/hard lockup, NMI) coupés : plus d'interruption
# périodique sur chaque cœur. Un vrai blocage n'est alors plus signalé dans
# les journaux ; le système reste aussi sûr.
kernel.watchdog=0
