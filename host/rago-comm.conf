# Rago OS — réglages de la partition d'échange RAGO-COMM (module M5).
# Installé dans /etc/rago/rago-comm.conf (root, 0644). Lu par le hook
# /usr/lib/rago/hooks/windows-security ; M6 et M7 s'en serviront aussi.
#
# RAGO-COMM : petite partition FAT32 (64 Mio suffisent) de type « Microsoft
# basic data », nommée RAGO-COMM, que Linux et le micro-Windows lisent tour à
# tour (jamais en même temps). Linux ne monte jamais la partition NTFS de Windows.

# Où Linux la monte, le temps d'une écriture.
RAGO_COMM_DIR=/run/rago/comm

# systemd : le hook démarre puis arrête l'unité RAGO_COMM_UNIT (montage à la
# demande, jamais laissé monté) ; none : la partition doit déjà être montée sur
# RAGO_COMM_DIR par quelqu'un d'autre.
RAGO_COMM_MOUNT=systemd
RAGO_COMM_UNIT=run-rago-comm.mount

# Périphérique attendu (doit correspondre à What= de l'unité). Par étiquette
# du système de fichiers ; /dev/disk/by-partlabel/RAGO-COMM marche aussi si la
# partition GPT porte ce nom (alors changer aussi What= par un fichier
# /etc/systemd/system/run-rago-comm.mount.d/*.conf).
RAGO_COMM_DEVICE=/dev/disk/by-label/RAGO-COMM

# 1 : refuser d'écrire si RAGO_COMM_DIR n'est pas en FAT32 (vfat).
RAGO_COMM_REQUIRE_VFAT=1
